<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completing Secure Checkout...</title>
    <!-- Load Paddle.js CDN -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="spinner"></div>
    <p>Connecting to secure checkout...</p>

    <script>
        // 1. Initialize Paddle with your Client-Side Token from Paddle Dashboard
        // Replace this string with your actual Paddle Client-Side Token (e.g. test_... or live_...)
        Paddle.Initialize({
            token: process.env.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN
        });

        // 2. Extract transaction ID (_ptxn) automatically passed by Paddle
        const urlParams = new URLSearchParams(window.location.search);
        const txnId = urlParams.get('_ptxn');

        // 3. Open the checkout overlay
        if (txnId) {
            Paddle.Checkout.open({
                transactionId: txnId
            });
        } else {
            document.body.innerHTML = "<p style='color:#ef4444;'>No transaction ID found. Please return to the extension and try again.</p>";
        }
    </script>
</body>

</html>
