<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completing Secure Checkout...</title>

    <!-- Load Paddle.js CDN -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>

    <div class="spinner"></div>
    <p>Connecting to secure checkout...</p>

    <script>
        // 1. Set Paddle environment before initialization.
        //    Keep this as sandbox while testing.
        Paddle.Environment.set("sandbox");

        // 2. Initialize Paddle with the client-side token.
        Paddle.Initialize({
            token: "test_69cc07dca8101aba02511983576"
        });

        // 3. Read the transaction ID and verified customer email.
        const urlParams = new URLSearchParams(window.location.search);
        const txnId = urlParams.get("_ptxn");
        const email = urlParams.get("email");

        // 4. Open the official Paddle checkout.
        if (txnId && email) {
            Paddle.Checkout.open({
                transactionId: txnId,

                customer: {
                    email: email
                },

                settings: {
                    displayMode: "overlay",
                    variant: "one-page",
                    theme: "dark",
                    allowLogout: false
                }
            });
        } else if (!txnId) {
            document.body.innerHTML =
                "<p style='color:#ef4444;'>No transaction ID found. Please return to the extension and try again.</p>";
        } else {
            document.body.innerHTML =
                "<p style='color:#ef4444;'>No customer email found. Please return to the extension and try again.</p>";
        }
    </script>

</body>

</html>
