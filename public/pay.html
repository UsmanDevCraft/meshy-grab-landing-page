<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completing Secure Checkout...</title>

    <!-- Load Paddle.js CDN -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="spinner"></div>
    <p>Connecting to secure checkout...</p>

    <script>
        // 1. Read URL parameters first
        const urlParams = new URLSearchParams(window.location.search);
        const txnId = urlParams.get("_ptxn");
        const email = urlParams.get("email");

        if (!txnId) {
            document.body.innerHTML =
                "<p style='color:#ef4444;'>No transaction ID found. Please return to MeshyGrab and try again.</p>";
        } else if (!email) {
            document.body.innerHTML =
                "<p style='color:#ef4444;'>No customer email found. Please return to MeshyGrab and try again.</p>";
        } else {
            // 2. Set Sandbox mode
            Paddle.Environment.set("sandbox");

            // 3. Initialize with global checkout settings (Forces Dark Mode & One-Page)
            Paddle.Initialize({
                token: "test_69cc07dca8101aba02511983576",
                checkout: {
                    settings: {
                        displayMode: "overlay",
                        variant: "one-page",
                        theme: "dark",
                        allowLogout: false
                    }
                }
            });

            // 4. Open transaction with pre-filled email
            Paddle.Checkout.open({
                transactionId: txnId,
                customer: {
                    email: email
                }
            });
        }
    </script>

</body>

</html>
